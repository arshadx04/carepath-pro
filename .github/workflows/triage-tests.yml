name: CarePath regression tests

on:
  push:
    branches: [main, 'fix/**', 'quality/**', 'database/**']
  pull_request:
    branches: [main]

jobs:
  triage-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carepath
          POSTGRES_PASSWORD: carepath_test
          POSTGRES_DB: carepath_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carepath -d carepath_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run SQLite regression tests
        run: npm test
      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://carepath:carepath_test@localhost:5432/carepath_test
