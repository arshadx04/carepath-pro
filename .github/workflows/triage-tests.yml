name: CarePath regression tests

on:
  push:
    branches: [main, 'fix/**', 'quality/**']
  pull_request:
    branches: [main]

jobs:
  triage-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run automated regression tests
        run: node --experimental-default-type=module --test tests/*.test.js
